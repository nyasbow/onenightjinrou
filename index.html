<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人狼系ボードゲーム</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #16213e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { font-size: 1.5rem; color: #e94560; }
        h2 { font-size: 1.2rem; color: #f9ed69; }
        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin: 8px 4px;
            transition: all 0.2s ease;
        }
        button:hover { background-color: #d73852; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .action-btn { background-color: #0f3460; border: 1px solid #e94560; width: 80%; }
        .action-btn:hover { background-color: #e94560; }
        
        /* 選択（クリック）されたボタンの強力なハイライト表示 */
        .action-btn.selected-target {
            background-color: #4ecca3 !important;
            color: #1a1a2e !important;
            font-weight: bold;
            border: 3px solid #ffffff !important;
            box-shadow: 0 0 15px rgba(78, 204, 163, 1);
        }

        select, input[type="number"], input[type="text"] {
            padding: 6px;
            font-size: 0.9rem;
            border-radius: 4px;
            background: #0f3460;
            color: white;
            border: 1px solid #e94560;
            box-sizing: border-box;
        }
        input[type="text"] { width: 80%; margin: 5px 0; text-align: center; }
        select, input[type="number"] { width: 100%; text-align: center; }
        .setup-group {
            background: #0f3460;
            margin: 8px 0;
            padding: 10px 15px;
            border-radius: 8px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-box {
            background: #0f3460;
            margin: 15px 0;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e94560;
        }
        .info-card {
            background: #1f4068;
            border: 1px dashed #f9ed69;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: left;
            font-size: 0.9rem;
        }
        .hidden { display: none; }
        .role-name { font-size: 1.5rem; font-weight: bold; color: #f9ed69; margin: 10px 0; }
        .win-title { font-size: 1.8rem; font-weight: bold; color: #4ecca3; margin: 10px 0; }
        .lose-title { font-size: 1.8rem; font-weight: bold; color: #e94560; margin: 10px 0; }
        .timer-display { font-size: 2.5rem; font-weight: bold; color: #e94560; margin: 10px 0; }
        .info-text { font-size: 0.9rem; color: #ccc; }
        .result-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85rem; }
        .result-table th, .result-table td { border: 1px solid #e94560; padding: 6px; }
        .result-table th { background: #0f3460; }
        .player-list-item { background: #0f3460; margin: 5px 0; padding: 8px; border-radius: 4px; border: 1px solid #334257; display: flex; justify-content: space-between; align-items: center; }

        .co-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
        }
        .co-card {
            background: #0f3460;
            border: 1px solid #e94560;
            border-radius: 8px;
            padding: 10px;
            width: 280px;
            box-sizing: border-box;
            text-align: left;
        }
        .co-card-name { font-weight: bold; color: #fff; margin-bottom: 5px; text-align: center; }
        
        .co-section {
            background: #16213e;
            border: 1px solid #334257;
            border-radius: 6px;
            padding: 6px;
            margin-top: 5px;
        }
        .memo-label { font-size: 0.7rem; color: #aaa; margin-top: 4px; display: block; }
        
        .stats-box { background: #0f3460; border: 1px solid #4ecca3; padding: 10px; border-radius: 8px; margin-top: 15px; text-align: left; font-size: 0.85rem; }
        .toggle-btn { background-color: #1f4068; border: 1px solid #4ecca3; font-size: 0.85rem; padding: 6px 12px; margin-bottom: 8px; }

        .role-badge {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            line-height: 1.2;
        }
        .role-badge img {
            height: 96px;
            object-fit: contain;
            margin-bottom: 4px;
        }
        .role-badge span {
            font-size: 0.8rem;
            color: #fff;
        }

        .werewolf-camp-text {
            color: #d32f2f !important;
            font-weight: bold;
        }

        .wolf-chat-box {
            background: #0b132b;
            border: 1px solid #d32f2f;
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
            text-align: left;
        }
        .wolf-chat-logs {
            height: 120px;
            overflow-y: auto;
            border: 1px solid #334257;
            padding: 6px;
            margin-bottom: 8px;
            background: #16213e;
            font-size: 0.85rem;
        }
        
        .memo-day-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-top: 6px;
        }
        .memo-day-box {
            background: #0f3460;
            padding: 4px;
            border-radius: 4px;
        }

        .history-box {
            background: #16213e;
            border: 1px solid #4ecca3;
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
            text-align: left;
            font-size: 0.85rem;
        }

        .big-announce-box {
            background: #0b132b;
            border: 3px solid #e94560;
            border-radius: 12px;
            padding: 30px 15px;
            margin: 20px 0;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.6);
        }
        .big-announce-main {
            font-size: 1.6rem;
            font-weight: bold;
            color: #f9ed69;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        .big-announce-sub {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ff6b6b;
            background: #16213e;
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
        }
    </style>

    <!-- Firebase SDK (CDN経由) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
    <h1 id="app-title">人狼系ボードゲーム</h1>

    <!-- 1. ロビー画面 -->
    <div id="screen-lobby">
        <h2>あなたの名前を入力</h2>
        <input type="text" id="my-name" placeholder="例: プレイヤー1" maxlength="10">
        
        <div style="margin-top:20px; border-top:1px solid #334257; padding-top:20px;">
            <h3>部屋を作る（ホスト）</h3>
            <button onclick="createRoom()">新しい部屋を作成</button>
        </div>

        <div style="margin-top:20px; border-top:1px solid #334257; padding-top:20px;">
            <h3>部屋に入る</h3>
            <input type="text" id="join-room-id" placeholder="4桁の部屋番号" maxlength="4">
            <br>
            <button onclick="joinRoom()">部屋に参加</button>
        </div>
    </div>

    <!-- 2. 待機部屋画面 -->
    <div id="screen-waiting" class="hidden">
        <h2>部屋コード: <span id="display-room-id" style="color:#f9ed69;"></span></h2>
        <p class="info-text">参加者にこの番号を伝えてください</p>
        
        <div class="card-box">
            <h3>参加プレイヤー一覧 (<span id="player-count-num">0</span>人 / 最大20人)</h3>
            <div id="waiting-player-list"></div>
        </div>

        <div class="stats-box">
            <button class="toggle-btn" onclick="toggleStatsVisibility()">ルーム内戦績・勝率を表示する</button>
            <div id="lobby-stats-content" class="hidden">戦績データはまだありません（ゲームを1回以上行うと集計されます）</div>
        </div>

        <div id="host-controls" class="hidden" style="margin-top: 15px;">
            <div class="card-box" style="border-color:#f9ed69;">
                <h3>ゲームモード選択</h3>
                <div class="setup-group">
                    <label>モード:</label>
                    <select id="cfg-gamemode" onchange="updateGameModeSetting()">
                        <option value="jinro">ワンナイト人狼モード (3〜10人)</option>
                        <option value="wordwolf">ワードウルフモード (3〜10人)</option>
                        <option value="standard">普通の人狼モード (3〜20人)</option>
                    </select>
                </div>
            </div>

            <!-- ワンナイト人狼用設定 -->
            <div id="setting-jinro-box" class="card-box" style="border-color:#f9ed69;">
                <h3>役職カード設定 (余り2枚)</h3>
                <p id="card-validation-msg" style="font-weight:bold; font-size:0.95rem;"></p>
                <div class="setup-group"><label><span class="role-badge"><img src="jinrou.png"><span class="werewolf-camp-text">人狼</span></span>:</label><input type="number" id="cfg-werewolf" value="2" min="0" max="8" onchange="updateRoleSettings()"></div>
                <div class="setup-group"><label><span class="role-badge"><img src="uranaishi.png"><span>占い師</span></span>:</label><input type="number" id="cfg-seer" value="1" min="0" max="5" onchange="updateRoleSettings()"></div>
                <div class="setup-group"><label><span class="role-badge"><img src="kaitou.png"><span>怪盗</span></span>:</label><input type="number" id="cfg-thief" value="1" min="0" max="5" onchange="updateRoleSettings()"></div>
                <div class="setup-group"><label><span class="role-badge"><img src="kyoujin.png"><span class="werewolf-camp-text">狂人</span></span>:</label><input type="number" id="cfg-madman" value="1" min="0" max="5" onchange="updateRoleSettings()"></div>
                <div class="setup-group"><label><span class="role-badge"><img src="murabito.png"><span>村人</span></span>:</label><input type="number" id="cfg-villager" value="2" min="0" max="10" onchange="updateRoleSettings()"></div>
            </div>

            <!-- ワードウルフ用設定 -->
            <div id="setting-wordwolf-box" class="card-box hidden" style="border-color:#f9ed69;">
                <h3>ワードウルフ設定</h3>
                <div class="setup-group">
                    <label>人狼（ウルフ）の人数:</label>
                    <input type="number" id="cfg-ww-wolves" value="1" min="1" max="5" onchange="updateRoleSettings()">
                </div>
                <div class="setup-group">
                    <label>自分の役職（村人/人狼）の表示:</label>
                    <select id="cfg-ww-showrole" onchange="updateRoleSettings()">
                        <option value="true">表示する（通常）</option>
                        <option value="false">表示しない（お題のみ）</option>
                    </select>
                </div>
            </div>

            <!-- 普通の人狼用設定 -->
            <div id="setting-standard-box" class="card-box hidden" style="border-color:#f9ed69;">
                <h3>普通の人狼 役職設定 (余りなし・ぴったり分配)</h3>
                <p id="std-card-validation-msg" style="font-weight:bold; font-size:0.95rem;"></p>
                <div class="setup-group"><label><span class="werewolf-camp-text">人狼</span>:</label><input type="number" id="std-cfg-werewolf" value="1" min="1" max="10" onchange="updateRoleSettings()"></div>
                <div class="setup-group"><label>占い師:</label><input type="number" id="std-cfg-seer" value="1" min="0" max="5" onchange="updateRoleSettings()"></div>
                <div class="setup-group"><label>霊媒師:</label><input type="number" id="std-cfg-medium" value="0" min="0" max="5" onchange="updateRoleSettings()"></div>
                <div class="setup-group"><label>狩人:</label><input type="number" id="std-cfg-hunter" value="0" min="0" max="5" onchange="updateRoleSettings()"></div>
                <div class="setup-group"><label><span class="werewolf-camp-text">狂人</span>:</label><input type="number" id="std-cfg-madman" value="0" min="0" max="5" onchange="updateRoleSettings()"></div>
                <div class="setup-group"><label><span class="werewolf-camp-text">狂信者</span>:</label><input type="number" id="std-cfg-fanatic" value="0" min="0" max="5" onchange="updateRoleSettings()"></div>
                <div class="setup-group"><label>村人:</label><input type="number" id="std-cfg-villager" value="2" min="0" max="15" onchange="updateRoleSettings()"></div>
                <div class="setup-group" style="margin-top:10px;">
                    <label>投票同数時の処理:</label>
                    <select id="std-cfg-tie" onchange="updateRoleSettings()">
                        <option value="none">処刑なし</option>
                        <option value="random">ランダム処刑</option>
                    </select>
                </div>
            </div>

            <div id="timer-setting-group" class="setup-group">
                <label>昼の議論タイマー (分):</label>
                <input type="number" id="timer-minutes" value="3" min="1" max="20" onchange="updateRoleSettings()">
            </div>
            <!-- 夜タイマー設定（分単位） -->
            <div id="night-timer-setting-group" class="setup-group hidden">
                <label>夜の時間タイマー (分):</label>
                <input type="number" id="timer-night-minutes" value="1" min="1" max="10" onchange="updateRoleSettings()">
            </div>

            <button id="start-game-btn" onclick="startOnlineGame()">ゲーム開始！</button>
        </div>
        <p id="client-wait-msg" class="info-text hidden">ホストがゲームを開始するのを待っています...</p>
    </div>

    <!-- 3. メインゲーム画面 -->
    <div id="screen-game" class="hidden">
        <h2 id="phase-title">夜のアクション</h2>
        <div id="action-area" class="card-box"></div>
    </div>

</div>

    async function joinRoom() {
        myName = document.getElementById('my-name').value.trim();
        const inputId = document.getElementById('join-room-id').value.trim();
        if(!myName || !inputId) { alert("名前と部屋番号を入力してください"); return; }

        const docRef = db.collection("rooms").doc(inputId);
        const doc = await docRef.get();

        if(!doc.exists) { alert("部屋が見つかりません"); return; }

        roomId = inputId;
        myPlayerId = "p_" + Date.now();
        isHost = false;

        let players = doc.data().players;
        if(players.length >= 20) { alert("部屋が満員（最大20人）です。"); return; }
        players.push({ id: myPlayerId, name: myName });

        await docRef.update({ players: players });
        listenRoom();
    }

    function listenRoom() {
        document.getElementById('screen-lobby').classList.add('hidden');
        document.getElementById('screen-waiting').classList.remove('hidden');
        document.getElementById('display-room-id').innerText = roomId;

        roomUnsubscribe = db.collection("rooms").doc(roomId).onSnapshot(doc => {
            if(!doc.exists) return;
            const data = doc.data();
            localRoomData = data;
            
            const appTitle = document.getElementById('app-title');
            if (data.gameMode === 'wordwolf') {
                appTitle.innerText = "人狼系ボードゲーム (ワードウルフ)";
            } else if(data.gameMode === 'standard') {
                appTitle.innerText = "人狼系ボードゲーム (普通の人狼)";
            } else {
                appTitle.innerText = "人狼系ボードゲーム (ワンナイト人狼)";
            }

            renderRoomState(data);
        });

    function renderRoomState(data) {
        if(data.status === "waiting") {
            lastRenderKey = "";
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-waiting').classList.remove('hidden');

            document.getElementById('waiting-player-list').innerHTML = 
                data.players.map(p => `<div class="player-list-item">👤 ${p.name} ${p.id === data.hostId ? '(ホスト)' : ''}</div>`).join('');
            document.getElementById('player-count-num').innerText = data.players.length;

            renderLobbyStats(data);

            if(isHost) {
                document.getElementById('host-controls').classList.remove('hidden');
                document.getElementById('client-wait-msg').classList.add('hidden');
                
                const mode = document.getElementById('cfg-gamemode').value;
                if(mode === 'wordwolf') {
                    document.getElementById('setting-jinro-box').classList.add('hidden');
                    document.getElementById('setting-wordwolf-box').classList.remove('hidden');
                    document.getElementById('setting-standard-box').classList.add('hidden');
                    document.getElementById('night-timer-setting-group').classList.add('hidden');

                    document.getElementById('setting-jinro-box').classList.add('hidden');
                    document.getElementById('setting-wordwolf-box').classList.add('hidden');
                    document.getElementById('setting-standard-box').classList.remove('hidden');
                    document.getElementById('night-timer-setting-group').classList.remove('hidden');
                    validateStandardRoleConfig(data);
                } else {
                    document.getElementById('setting-jinro-box').classList.remove('hidden');
                    document.getElementById('setting-wordwolf-box').classList.add('hidden');
                    document.getElementById('setting-standard-box').classList.add('hidden');
                    document.getElementById('night-timer-setting-group').classList.add('hidden');
                    validateRoleConfig(data);
                }
            } else {
                document.getElementById('host-controls').classList.add('hidden');
                document.getElementById('client-wait-msg').classList.remove('hidden');
            }
        } else {
            document.getElementById('screen-waiting').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            renderGamePhase(data);
        }
    }

    function renderLobbyStats(data) {
        const statsContainer = document.getElementById('lobby-stats-content');
        const stats = data.playerStats || {};
        const pIds = Object.keys(stats);

        if(pIds.length === 0) {
            statsContainer.innerHTML = `<p style="color:#ccc; margin:4px 0;">まだ対戦データがありません。</p>`;
            return;
        }

        let html = "";
        data.players.forEach(p => {
            let pStat = stats[p.id];
            if(!pStat) {
                html += `<p style="margin:4px 0;"><b>👤 ${p.name}:</b> まだ対戦データなし</p>`;
                return;
            }

            let totalRate = pStat.totalPlayed > 0 ? Math.round((pStat.totalWon / pStat.totalPlayed) * 100) : 0;
            html += `<div style="border-bottom:1px dashed #334257; padding-bottom:6px; margin-bottom:6px;">`;
            html += `<b>👤 ${p.name}</b> (総試合: ${pStat.totalPlayed}回)<br>`;
            html += `・勝率: <b>${totalRate}%</b> (${pStat.totalWon}/${pStat.totalPlayed})<br>`;
            html += `</div>`;
        });

        statsContainer.innerHTML = html;
    }

    function validateRoleConfig(data) {
        const mode = document.getElementById('cfg-gamemode').value;
        if(mode !== 'jinro') return true;

        const pCount = data.players.length;
        const targetTotal = pCount + 2;

        const w = parseInt(document.getElementById('cfg-werewolf').value) || 0;
        const s = parseInt(document.getElementById('cfg-seer').value) || 0;
        const t = parseInt(document.getElementById('cfg-thief').value) || 0;
        const m = parseInt(document.getElementById('cfg-madman').value) || 0;
        const v = parseInt(document.getElementById('cfg-villager').value) || 0;
        const currentTotal = w + s + t + m + v;

        const msgElem = document.getElementById('card-validation-msg');
        const btnElem = document.getElementById('start-game-btn');
        if(!msgElem || !btnElem) return true;

        if (currentTotal !== targetTotal) {
            msgElem.style.color = "#ff6b6b";
            msgElem.innerText = `役職数が不適です (現在: ${currentTotal}枚 / 必要: ${targetTotal}枚)`;
            btnElem.disabled = true;
            return false;
        } else {
            msgElem.style.color = "#4ecca3";
            msgElem.innerText = `枚数OK (合計: ${currentTotal}枚)`;
            btnElem.disabled = false;
            return true;
        }
    }

    async function startOnlineGame() {
        const players = localRoomData.players;
        const count = players.length;
        const mode = localRoomData.gameMode || "jinro";

        if(mode === "standard") {
            if(count < 3 || count > 20) { alert("普通の人狼モードには3〜20人必要です。"); return; }
        } else {
            if(count < 3 || count > 10) { alert("このモードには3〜10人必要です。"); return; }
        }

        myNightActionResultText = "";
        personalMemos = {};
        myNightDoneLocal = false;
        myRoleHistory = [];
        selectedVoteTargetId = null;
        currentNightDayTracked = 0;

        let aliveObj = {};
        players.forEach(p => aliveObj[p.id] = true);

        let updatePayload = {
            status: "night_action",
            nightDone: {},
            nightActions: {},
            wolfReVote: false,
            wolfReVoteCandidates: [],
            wolfChatLogs: [],
            alivePlayers: aliveObj,
            lastHangedId: null,
            lastNightVictimId: null,
            lastHunterTarget: {},
            dayCount: 1,
            votes: {},
            voteLogs: [],
            standardVoteState: null,
            guessVotes: {},
            timerEndTime: null,
            nightTimerEndTime: Date.now() + ((localRoomData.timerNightMinutes || 1) * 60 * 1000)
        };

        if(mode === "standard") {
            if(!validateStandardRoleConfig(localRoomData)) { alert("役職数が不適です"); return; }
            const config = localRoomData.stdRoleConfig;
            let deck = [];
            Object.keys(config).forEach(role => {
                for(let i=0; i<config[role]; i++) deck.push(role);
            });

            const allDeckCopy = [...deck];
            deck.sort(() => Math.random() - 0.5);

            let initRoles = {};
            let finRoles = {};
            players.forEach((p, idx) => {
                initRoles[p.id] = deck[idx];
                finRoles[p.id] = deck[idx];
            });

            updatePayload.allDeck = allDeckCopy;
            updatePayload.initialRoles = initRoles;
            updatePayload.finalRoles = finRoles;
            updatePayload.centralCards = [];
            updatePayload.wordWolfData = {};

        } else if(mode === "wordwolf") {
            const wolfCount = (localRoomData.wordWolfConfig && localRoomData.wordWolfConfig.wolves) || 1;
            if(wolfCount >= count) { alert("人狼の人数がプレイヤー数以上になっています。"); return; }

            const groupObj = wordWolfGroups[Math.floor(Math.random() * wordWolfGroups.length)];
            let itemsCopy = [...groupObj.items];
            itemsCopy.sort(() => Math.random() - 0.5);
            const civilianWord = itemsCopy[0];
            const wolfWord = itemsCopy[1];

            let shuffledPlayers = [...players];
            shuffledPlayers.sort(() => Math.random() - 0.5);
            
            let wwAssignments = {};
            let initRoles = {};
            let finRoles = {};

            shuffledPlayers.forEach((p, idx) => {
                if(idx < wolfCount) {
                    initRoles[p.id] = "人狼";
                    finRoles[p.id] = "人狼";
                    wwAssignments[p.id] = wolfWord;
                } else {
                    initRoles[p.id] = "村人";
                    finRoles[p.id] = "村人";
                    wwAssignments[p.id] = civilianWord;
                }
            });

            updatePayload.allDeck = groupObj.items;
            updatePayload.initialRoles = initRoles;
            updatePayload.finalRoles = finRoles;
            updatePayload.centralCards = [];
            updatePayload.wordWolfData = { civilianWord: civilianWord, wolfWord: wolfWord, assignments: wwAssignments };

        } else {
            if(!validateRoleConfig(localRoomData)) { alert("役職数が不適です"); return; }
            const config = localRoomData.roleConfig || { "人狼": 2, "占い師": 1, "怪盗": 1, "狂人": 1, "村人": 2 };
            let deck = [];
            Object.keys(config).forEach(role => {
                for(let i=0; i<config[role]; i++) deck.push(role);
            });

            const allDeckCopy = [...deck];
            deck.sort(() => Math.random() - 0.5);

            let initRoles = {};
            let finRoles = {};
            players.forEach((p, idx) => {
                initRoles[p.id] = deck[idx];
                finRoles[p.id] = deck[idx];
            });

            let centrals = [deck[count], deck[count + 1]];
            updatePayload.allDeck = allDeckCopy;
            updatePayload.initialRoles = initRoles;
            updatePayload.finalRoles = finRoles;
            updatePayload.centralCards = centrals;
            updatePayload.wordWolfData = {};
        }

        await db.collection("rooms").doc(roomId).update(updatePayload);
    }

    function renderGamePhase(data) {
        const title = document.getElementById('phase-title');
        const mode = data.gameMode || "jinro";

        if(data.status === "night_action") {
            title.innerText = mode === "wordwolf" ? "お題確認タイム" : `${data.dayCount || 1}日目の夜の時間`;
            
            if (!window.nightTimerRunning) {
                startNightTimerSync(data);
            }

            if(mode === "wordwolf") {
                renderWordWolfNight(data);
            } else if(mode === "standard") {
                renderStandardNight(data);
            } else {
                renderNightActionsHub(data);
            }
        } else {
            if (nightTimerInterval) { clearInterval(nightTimerInterval); nightTimerInterval = null; window.nightTimerRunning = false; }
        }

        if(data.status === "last_words") {
            lastRenderKey = "last_words_" + (data.dayCount || 1);
            title.innerText = "遺言タイム";
            renderLastWordsPhase(data);
        } else if(data.status === "vote_announce_hold") {
            lastRenderKey = "vote_announce_hold_" + (data.dayCount || 1);
            title.innerText = "投票結果発表";

            let hangedP = data.lastHangedId ? data.players.find(p => p.id === data.lastHangedId) : null;
            let announceMain = hangedP 
                ? `📢 投票の結果 <span style="color:#f9ed69;">${hangedP.name}</span> さんが追放されました` 
                : `📢 投票の結果 <span style="color:#4ecca3;">誰も追放されませんでした</span>`;

            document.getElementById('action-area').innerHTML = `
                <div class="big-announce-box">
                    <div class="big-announce-main">${announceMain}</div>
                    <div class="big-announce-sub">🌙 夜を迎えます。ミュートしてください。</div>
                </div>
                <p class="info-text">まもなく夜の時間へ移動します (3秒)</p>
            `;

            if(isHost && !window.voteAnnounceTimerSet) {
                window.voteAnnounceTimerSet = true;
                setTimeout(async () => {
                    window.voteAnnounceTimerSet = false;
                    let freshData = (await db.collection("rooms").doc(roomId).get()).data();
                    if(freshData.status === "vote_announce_hold") {
                        let winState = checkStandardWinCondition(freshData.finalRoles, freshData.alivePlayers);
                        if(winState) {
                            await db.collection("rooms").doc(roomId).update({
                                status: "result",
                                playerStats: calculateStandardResults(freshData, winState)
                            });
                        } else {
                            await db.collection("rooms").doc(roomId).update({
                                status: "night_action",
                                dayCount: (freshData.dayCount || 1) + 1,
                                nightDone: {},
                                nightActions: {},
                                votes: {},
                                nightTimerEndTime: Date.now() + ((freshData.timerNightMinutes || 1) * 60 * 1000)
                            });
                            myNightDoneLocal = false;
                            selectedVoteTargetId = null;
                        }
                    }
                }, 3000);
            }

        } else if(data.status === "morning_transition") {
            lastRenderKey = "morning_transition_" + (data.dayCount || 1);
            title.innerText = "朝を迎えます...";

            let vicP = data.lastNightVictimId ? data.players.find(p => p.id === data.lastNightVictimId) : null;
            let morningMain = vicP 
                ? `☀️ 夜が明けると <span style="color:#e94560;">${vicP.name}</span> さんが無惨な姿で発見されました` 
                : `☀️ 夜が明けると <span style="color:#4ecca3;">犠牲者はいませんでした</span>`;

            document.getElementById('action-area').innerHTML = `
                <div class="big-announce-box" style="border-color:#4ecca3; box-shadow: 0 0 20px rgba(78, 204, 163, 0.6);">
                    <div class="big-announce-main">${morningMain}</div>
                    <div class="big-announce-sub" style="color:#4ecca3;">🎙️ ミュートを解除してください</div>
                </div>
                <p class="info-text">まもなく昼の議論が始まります (3秒)</p>
            `;

            if(isHost && !window.morningTimerSet) {
                window.morningTimerSet = true;
                setTimeout(async () => {
                    window.morningTimerSet = false;
                    await processMorningTransition();
                }, 3000);
            }
        } else if(data.status === "day_discussion") {
            myNightDoneLocal = false;
            selectedVoteTargetId = null;
            title.innerText = `${data.dayCount || 1}日目の昼の議論タイム`;
            if (!document.getElementById('timer')) {
                startTimerSync(data);
            } else {
                renderMemoGridOnly();
            }
        } else if(data.status === "voting") {
            title.innerText = mode === "standard" ? "夕方：投票フェーズ" : "投票フェーズ";
            if(mode === "standard") {
                renderStandardVotingPhase(data);
            } else {
                if(data.votes && data.votes[myPlayerId] !== undefined) {
                    let key = "voting_done_" + myPlayerId;
                    if (lastRenderKey !== key) {
                        lastRenderKey = key;
                        document.getElementById('action-area').innerHTML = `<p>投票が完了しました。</p><p class="info-text">全員の投票が揃うまでお待ちください...</p>`;
                    }
                } else {
                    renderVotingButtons(data);
                }
            }
        } else if(data.status === "wordwolf_guess") {
            title.innerText = "お題推定フェーズ (1分)";
            renderWordWolfGuessPhase(data);
        } else if(data.status === "result") {
            lastRenderKey = "result_" + (data.dayCount || 1);
            title.innerText = "最終結果発表";
            renderOnlineResults(data);
        }
    }

    function startNightTimerSync(data) {
        window.nightTimerRunning = true;
        if(nightTimerInterval) clearInterval(nightTimerInterval);

        nightTimerInterval = setInterval(() => {
            const now = Date.now();
            const diff = Math.max(0, Math.floor(((data.nightTimerEndTime || (Date.now() + 60000)) - now) / 1000));
            
            const timerElem = document.getElementById('night-timer');
            if(timerElem) timerElem.innerText = `${String(Math.floor(diff/60)).padStart(2,'0')}:${String(diff%60).padStart(2,'0')}`;

            if(diff <= 0) {
                clearInterval(nightTimerInterval);
                nightTimerInterval = null;
                window.nightTimerRunning = false;
                if(isHost) {
                    forceCompleteNightAndTransition();
                }
            }
        }, 1000);
    }

    async function forceCompleteNightAndTransition() {
        let freshData = (await db.collection("rooms").doc(roomId).get()).data();
        if(freshData.status !== "night_action") return;

        const mode = freshData.gameMode || "jinro";
        let nightDone = freshData.nightDone || {};
        let nActions = freshData.nightActions || {};
        let alivePlayers = freshData.alivePlayers || {};

        if(mode === "standard") {
            freshData.players.forEach(p => {
                if(!alivePlayers[p.id]) return;
                let role = freshData.finalRoles[p.id];
                let livingOthers = freshData.players.filter(o => o.id !== p.id && alivePlayers[o.id]);

                if(role === "人狼" && freshData.dayCount > 1) {
                    let hasAttacked = Object.keys(nActions).some(id => freshData.finalRoles[id] === "人狼" && nActions[id].attackTarget);
                    if(!hasAttacked && livingOthers.length > 0) {
                        let randTarget = livingOthers[Math.floor(Math.random() * livingOthers.length)];
                        if(!nActions[p.id]) nActions[p.id] = {};
                        nActions[p.id].attackTarget = randTarget.id;
                    }
                } else if(role === "占い師" && freshData.dayCount > 1) {
                    if(!nActions[p.id] && livingOthers.length > 0) {
                        let randTarget = livingOthers[Math.floor(Math.random() * livingOthers.length)];
                        if(!nActions[p.id]) nActions[p.id] = {};
                        nActions[p.id].seerTarget = randTarget.id;
                    }
                } else if(role === "狩人" && freshData.dayCount > 1) {
                    if(!nActions[p.id] && livingOthers.length > 0) {
                        let lastT = (freshData.lastHunterTarget && freshData.lastHunterTarget[p.id]) || null;
                        let validTargets = livingOthers.filter(o => o.id !== lastT);
                        if(validTargets.length === 0) validTargets = livingOthers;
                        let randTarget = validTargets[Math.floor(Math.random() * validTargets.length)];
                        if(!nActions[p.id]) nActions[p.id] = {};
                        nActions[p.id].hunterTarget = randTarget.id;
                    }
                }
                nightDone[p.id] = true;
            });

            let stdRes = processStandardNightActions({ ...freshData, nightActions: nActions });
            let updates = {
                nightActions: nActions,
                nightDone: nightDone
            };

            if(stdRes.reVote) {
                updates.wolfReVote = true;
                updates.wolfReVoteCandidates = stdRes.reVoteCandidates;
            } else {
                updates.status = "morning_transition";
                updates.lastNightVictimId = stdRes.victimId;
                updates.lastHunterTarget = stdRes.lastHunterTarget;
                updates.wolfReVote = false;
            }
            await db.collection("rooms").doc(roomId).update(updates);
        } else {
            freshData.players.forEach(p => { nightDone[p.id] = true; });
            await db.collection("rooms").doc(roomId).update({
                nightDone: nightDone,
                status: "day_discussion",
                timerEndTime: Date.now() + ((freshData.timerMinutes || 3) * 60 * 1000)
            });
        }
    }

    function renderStandardVotingPhase(data) {
        const area = document.getElementById('action-area');
        const vState = data.standardVoteState;

        if(!vState) {
            if(isHost) initStandardVoteState(data);
            area.innerHTML = `<p>投票フェーズを準備中...</p>`;
            return;
        }

        buildVotingPhaseShell(data, vState);

        if (!votePhaseTimerInterval) {
            startVotePhaseTimer(data);
        }
    }

    function buildVotingPhaseShell(data, vState) {
        const area = document.getElementById('action-area');
        const now = Date.now();

        if(vState.phase === 'handraise') {
            let myVote = vState.votes && vState.votes[myPlayerId];
            let myRaised = vState.hands && vState.hands[myPlayerId];
            let votedCount = Object.keys(vState.votes || {}).length;
            let livingCount = data.players.filter(p => data.alivePlayers[p.id]).length;
            let remSec = Math.max(0, Math.floor(((vState.handraiseEndTime || 0) - now) / 1000));

            if(!data.alivePlayers[myPlayerId]) {
                area.innerHTML = `<p style="color:#e94560;">あなたは死亡しているため投票できません。</p><p class="info-text">生存プレイヤーの挙手・投票を待っています...</p>`;
                return;
            }

            let html = `
                <div id="v-shell-container">
                    <p><b>挙手制投票フェーズ (<span id="voted-count-span">${votedCount}</span>/${livingCount}名完了)</b></p>
                    <div class="timer-display" id="shared-vote-timer">00:${String(remSec).padStart(2,'0')}</div>
                    <div id="v-sub-area">
            `;

            if(myVote) {
                html += `<p style="color:#4ecca3; font-weight:bold;">あなたの投票表明は完了しました。</p><p class="info-text">他のプレイヤーの挙手・投票を待っています...</p>`;
            } else if(!myRaised) {
                html += `<button id="raise-hand-btn" style="background-color:#4ecca3; color:#1a1a2e; font-weight:bold; font-size:1.2rem; padding:15px 30px;" onclick="raiseHand()">✋ 挙手する</button>`;
            } else {
                html += `<p style="color:#4ecca3; font-weight:bold;">挙手しました！順番を確定しています...</p>`;
            }
            html += `</div></div>`;
            area.innerHTML = html;

        } else if(vState.phase === 'notice') {
            let speaker = data.players.find(p => p.id === vState.speakerId);
            area.innerHTML = `
                <div style="font-size:1.8rem; color:#f9ed69; font-weight:bold; margin:30px 0;">
                    ${speaker ? speaker.name : ''} さんが投票します
                </div>
                <p class="info-text">まもなく30秒間の投票理由時間が始まります...</p>
            `;

            if(isHost && !window.noticeTimerStarted) {
                window.noticeTimerStarted = true;
                setTimeout(async () => {
                    window.noticeTimerStarted = false;
                    let freshData = (await db.collection("rooms").doc(roomId).get()).data();
                    let fState = freshData.standardVoteState;
                    if(fState && fState.phase === 'notice') {
                        fState.phase = 'speaking';
                        fState.speechEndTime = Date.now() + 30000;
                        await db.collection("rooms").doc(roomId).update({ standardVoteState: fState });
                    }
                }, 3000);
            }

        } else if(vState.phase === 'speaking') {
            let speaker = data.players.find(p => p.id === vState.speakerId);
            let isSpeaker = (myPlayerId === vState.speakerId);
            let remSec = Math.max(0, Math.floor(((vState.speechEndTime || 0) - now) / 1000));

            let html = `
                <p><b>${speaker ? speaker.name : ''} さんの投票表明中</b></p>
                <div class="timer-display" id="shared-vote-timer">00:${String(remSec).padStart(2,'0')}</div>
            `;

            if(isAlive(data, myPlayerId)) {
                if(isSpeaker) {
                    html += `<p class="info-text">投票先を選択し、理由を話したら「投票表明を終える」を押してください：</p>`;
                    let currentChoice = selectedVoteTargetId || (vState.votes && vState.votes[myPlayerId]) || "";
                    
                    data.players.filter(p => p.id !== myPlayerId && data.alivePlayers[p.id]).forEach(p => {
                        let isSel = (currentChoice === p.id);
                        html += `<button class="action-btn ${isSel ? 'selected-target' : ''}" onclick="selectStandardVoteChoice('${p.id}')">${p.name} に投票 ${isSel ? '✓ 選択中' : ''}</button><br>`;
                    });
                    html += `<button style="background-color:#4ecca3; color:#1a1a2e; font-weight:bold; margin-top:15px;" onclick="finishSpeech()">投票表明を終える</button>`;
                } else {
                    html += `<p class="info-text">${speaker ? speaker.name : ''} さんが投票理由を述べています...</p>`;
                }
            } else {
                html += `<p style="color:#e94560;">あなたは死亡しています。</p>`;
            }

            area.innerHTML = html;

        } else if(vState.phase === 'runoff_notice') {
            let runoffNames = (vState.runoffList || []).map(id => data.players.find(p => p.id === id)?.name).join(' と ');
            area.innerHTML = `
                <div style="font-size:1.5rem; color:#f9ed69; font-weight:bold; margin:20px 0;">
                    最多得票が同数でした。<br>${runoffNames} の決戦弁明を行います。
                </div>
                <p class="info-text">まもなく決戦弁明が始まります...</p>
            `;

            if(isHost && !window.runoffNoticeStarted) {
                window.runoffNoticeStarted = true;
                setTimeout(async () => {
                    window.runoffNoticeStarted = false;
                    let freshData = (await db.collection("rooms").doc(roomId).get()).data();
                    let fState = freshData.standardVoteState;
                    if(fState && fState.phase === 'runoff_notice') {
                        fState.phase = 'runoff_speech';
                        fState.runoffIndex = 0;
                        fState.speakerId = fState.runoffOrder[0];
                        fState.speechEndTime = Date.now() + 60000;
                        await db.collection("rooms").doc(roomId).update({ standardVoteState: fState });
                    }
                }, 3000);
            }

        } else if(vState.phase === 'runoff_speech') {
            let speaker = data.players.find(p => p.id === vState.speakerId);
            let isSpeaker = (myPlayerId === vState.speakerId);
            let remSec = Math.max(0, Math.floor(((vState.speechEndTime || 0) - now) / 1000));
            let m = Math.floor(remSec / 60);
            let s = remSec % 60;

            let html = `
                <p><b>決戦弁明 (${(vState.runoffIndex || 0) + 1}/${vState.runoffOrder.length}): ${speaker ? speaker.name : ''} さん</b></p>
                <div class="timer-display" id="shared-vote-timer">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div>
            `;

            if(isAlive(data, myPlayerId)) {
                if(isSpeaker) {
                    html += `<p class="info-text">1分間の弁明をどうぞ。終わったら「決戦弁明を終える」を押してください。</p>`;
                    html += `<button style="background-color:#4ecca3; color:#1a1a2e; font-weight:bold; margin-top:15px;" onclick="finishRunoffSpeech()">決戦弁明を終える</button>`;
                } else {
                    html += `<p class="info-text">${speaker ? speaker.name : ''} さんが弁明中です...</p>`;
                }
            } else {
                html += `<p style="color:#e94560;">あなたは死亡しています。</p>`;
            }

            area.innerHTML = html;

        } else if(vState.phase === 'runoff_voting') {
            let html = `<p><b>決選投票 (対象者以外による一斉投票)</b></p>`;
            let isRunoffTarget = vState.runoffList.includes(myPlayerId);

            if(!isAlive(data, myPlayerId)) {
                html += `<p style="color:#e94560;">あなたは死亡しています。</p>`;
            } else if(isRunoffTarget) {
                html += `<p style="color:#f9ed69;">あなたは決戦対象者のため、今回の再投票には参加できません。他のプレイヤーの投票を待っています...</p>`;
            } else {
                let currentChoice = selectedVoteTargetId || (vState.votes && vState.votes[myPlayerId]);
                if(!vState.votes || !vState.votes[myPlayerId]) {
                    html += `<p class="info-text">決戦対象者のどちらかに投票してください：</p>`;
                    vState.runoffList.forEach(id => {
                        let p = data.players.find(x => x.id === id);
                        if(p) {
                            let isSel = (currentChoice === p.id);
                            html += `<button class="action-btn ${isSel ? 'selected-target' : ''}" onclick="submitRunoffVote('${p.id}')">${p.name} に投票 ${isSel ? '✓ 選択中' : ''}</button><br>`;
                        }
                    });
                } else {
                    html += `<p style="color:#4ecca3;">投票完了しました。全員の投票を待っています...</p>`;
                }
            }
            area.innerHTML = html;
        }
    }

    function updateVotingPhaseDynamic(data, vState) {
        let timerElem = document.getElementById('shared-vote-timer');
        if (timerElem && (vState.phase === 'handraise' || vState.phase === 'speaking' || vState.phase === 'runoff_speech')) {
            let targetTime = vState.phase === 'handraise' ? vState.handraiseEndTime : vState.speechEndTime;
            let remSec = Math.max(0, Math.floor(((targetTime || 0) - Date.now()) / 1000));
            if (vState.phase === 'runoff_speech') {
                let m = Math.floor(remSec / 60);
                let s = remSec % 60;
                timerElem.innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            } else {
                timerElem.innerText = `00:${String(remSec).padStart(2,'0')}`;
            }
        }

        let votedCountSpan = document.getElementById('voted-count-span');
        if (votedCountSpan && vState.phase === 'handraise' && vState.votes) {
            votedCountSpan.innerText = Object.keys(vState.votes).length;
        }
    }

    function startVotePhaseTimer(data) {
        if(votePhaseTimerInterval) clearInterval(votePhaseTimerInterval);

        votePhaseTimerInterval = setInterval(async () => {
            if (!localRoomData || localRoomData.status !== "voting" || !localRoomData.standardVoteState) {
                clearInterval(votePhaseTimerInterval);
                votePhaseTimerInterval = null;
                return;
            }

            let vState = localRoomData.standardVoteState;
            let now = Date.now();

            let timerElem = document.getElementById('shared-vote-timer');
            if (timerElem) {
                let targetTime = (vState.phase === 'handraise') ? vState.handraiseEndTime : vState.speechEndTime;
                let remSec = Math.max(0, Math.floor(((targetTime || 0) - now) / 1000));
                if (vState.phase === 'runoff_speech') {
                    let m = Math.floor(remSec / 60);
                    let s = remSec % 60;
                    timerElem.innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                } else {
                    timerElem.innerText = `00:${String(remSec).padStart(2,'0')}`;
                }
            }

            if (isHost) {
                let freshData = (await db.collection("rooms").doc(roomId).get()).data();
                if (!freshData || freshData.status !== "voting" || !freshData.standardVoteState) return;
                let fState = freshData.standardVoteState;

                if (fState.phase === 'handraise') {
                    let currentRem = Math.max(0, Math.floor(((fState.handraiseEndTime || 0) - now) / 1000));
                    let hands = fState.hands || {};
                    let votedList = Object.keys(fState.votes || {});
                    let unvotedLiving = freshData.players.filter(p => freshData.alivePlayers[p.id] && !votedList.includes(p.id)).map(p => p.id);
                    let validHands = Object.entries(hands).filter(entry => unvotedLiving.includes(entry[0])).sort((a,b) => a[1] - b[1]);

                    if (validHands.length > 0 || currentRem <= 0) {
                        let chosenId = validHands.length > 0 ? validHands[0][0] : unvotedLiving[Math.floor(Math.random() * unvotedLiving.length)];
                        fState.phase = 'notice';
                        fState.speakerId = chosenId;
                        fState.noticeEndTime = Date.now() + 3000;
                        await db.collection("rooms").doc(roomId).update({ standardVoteState: fState });
                    }
                } else if (fState.phase === 'speaking') {
                    let currentRem = Math.max(0, Math.floor(((fState.speechEndTime || 0) - now) / 1000));
                    if (currentRem <= 0) {
                        let currentSpeaker = fState.speakerId;
                        if (!fState.votes) fState.votes = {};
                        if (!fState.votes[currentSpeaker]) {
                            let possibleTargets = freshData.players.filter(p => p.id !== currentSpeaker && freshData.alivePlayers[p.id]).map(p => p.id);
                            fState.votes[currentSpeaker] = possibleTargets[Math.floor(Math.random() * possibleTargets.length)];
                        }
                        advanceStandardVoting(freshData, fState);
                    }
                } else if (fState.phase === 'runoff_speech') {
                    let currentRem = Math.max(0, Math.floor(((fState.speechEndTime || 0) - now) / 1000));
                    if (currentRem <= 0) {
                        let nextIdx = (fState.runoffIndex || 0) + 1;
                        if (nextIdx < fState.runoffOrder.length) {
                            fState.runoffIndex = nextIdx;
                            fState.speakerId = fState.runoffOrder[nextIdx];
                            fState.speechEndTime = Date.now() + 60000;
                            await db.collection("rooms").doc(roomId).update({ standardVoteState: fState });
                        } else {
                            fState.phase = 'runoff_voting';
                            fState.votes = {};
                            await db.collection("rooms").doc(roomId).update({ standardVoteState: fState });
                        }
                    }
                }
            }
        }, 500);
    }

    function isAlive(data, pId) {
        return data.alivePlayers && data.alivePlayers[pId];
    }

    async function initStandardVoteState(data) {
        let initialState = {
            phase: 'handraise',
            hands: {},
            votes: {},
            speakerId: null,
            handraiseEndTime: Date.now() + 10000,
            noticeEndTime: 0,
            speechEndTime: 0,
            runoffList: [],
            runoffOrder: [],
            runoffIndex: 0
        };
        await db.collection("rooms").doc(roomId).update({ standardVoteState: initialState });
    }

    async function raiseHand() {
        let fData = (await db.collection("rooms").doc(roomId).get()).data();
        let vState = fData.standardVoteState;
        if(!vState || vState.phase !== 'handraise') return;
        if(!vState.hands) vState.hands = {};
        if(!vState.hands[myPlayerId]) {
            vState.hands[myPlayerId] = Date.now();
            await db.collection("rooms").doc(roomId).update({ standardVoteState: vState });
        }
    }

    async function selectStandardVoteChoice(targetId) {
        selectedVoteTargetId = targetId;
        
        let fData = (await db.collection("rooms").doc(roomId).get()).data();
        let vState = fData.standardVoteState;
        if(!vState || vState.speakerId !== myPlayerId) return;
        
        let updateObj = {};
        updateObj[`standardVoteState.votes.${myPlayerId}`] = targetId;
        await db.collection("rooms").doc(roomId).update(updateObj);
        
        renderStandardVotingPhase(localRoomData);
    }

    async function finishSpeech() {
        if(votePhaseTimerInterval) { clearInterval(votePhaseTimerInterval); votePhaseTimerInterval = null; }

        let fData = (await db.collection("rooms").doc(roomId).get()).data();
        let vState = fData.standardVoteState;
        if(!vState || vState.speakerId !== myPlayerId) return;

        if(!vState.votes) vState.votes = {};
        if(!vState.votes[vState.speakerId]) {
            let choice = selectedVoteTargetId;
            if(!choice) {
                let possibleTargets = fData.players.filter(p => p.id !== vState.speakerId && fData.alivePlayers[p.id]).map(p => p.id);
                choice = possibleTargets[Math.floor(Math.random() * possibleTargets.length)];
            }
            vState.votes[vState.speakerId] = choice;
        }

        selectedVoteTargetId = null;
        await advanceStandardVoting(fData, vState);
    }

    async function finishRunoffSpeech() {
        if(votePhaseTimerInterval) { clearInterval(votePhaseTimerInterval); votePhaseTimerInterval = null; }

        let fData = (await db.collection("rooms").doc(roomId).get()).data();
        let vState = fData.standardVoteState;
        if(!vState || vState.speakerId !== myPlayerId) return;

        let nextIdx = (vState.runoffIndex || 0) + 1;
        if(nextIdx < vState.runoffOrder.length) {
            vState.runoffIndex = nextIdx;
            vState.speakerId = vState.runoffOrder[nextIdx];
            vState.speechEndTime = Date.now() + 60000;
            await db.collection("rooms").doc(roomId).update({ standardVoteState: fState });
        } else {
            vState.phase = 'runoff_voting';
            vState.votes = {};
            await db.collection("rooms").doc(roomId).update({ standardVoteState: fState });
        }
    }

    async function submitRunoffVote(targetId) {
        selectedVoteTargetId = targetId;
        
        let fData = (await db.collection("rooms").doc(roomId).get()).data();
        let vState = fData.standardVoteState;
        if(!vState) return;

        let updateObj = {};
        updateObj[`standardVoteState.votes.${myPlayerId}`] = targetId;
        await db.collection("rooms").doc(roomId).update(updateObj);

        let runoffTargets = vState.runoffList;
        let voters = fData.players.filter(p => fData.alivePlayers[p.id] && !runoffTargets.includes(p.id)).map(p => p.id);
        let updatedVotes = { ...(vState.votes || {}), [myPlayerId]: targetId };
        let votedCount = voters.filter(id => updatedVotes[id] !== undefined).length;

        if(votedCount >= voters.length) {
            vState.votes = updatedVotes;
            resolveStandardRunoffVotes(fData, vState);
        } else {
            renderStandardVotingPhase(localRoomData);
        }
    }

    async function advanceStandardVoting(data, vState) {
        let livingIds = data.players.filter(p => data.alivePlayers[p.id]).map(p => p.id);
        let votedSpeakers = Object.keys(vState.votes || {});

        if(votedSpeakers.length < livingIds.length) {
            vState.phase = 'handraise';
            vState.hands = {};
            vState.speakerId = null;
            vState.handraiseEndTime = Date.now() + 10000;
            lastRenderKey = "";
            await db.collection("rooms").doc(roomId).update({ standardVoteState: vState });
        } else {
            resolveStandardVotes(data, vState);
        }
    }

    async function resolveStandardVotes(data, vState) {
        let votes = vState.votes || {};
        let voteCounts = {};
        data.players.forEach(p => voteCounts[p.id] = 0);
        Object.values(votes).forEach(t => { if(voteCounts[t] !== undefined) voteCounts[t]++; });

        let maxV = 0;
        Object.values(voteCounts).forEach(c => { if(c > maxV) maxV = c; });

        let topTargets = [];
        Object.keys(voteCounts).forEach(id => { if(voteCounts[id] === maxV) topTargets.push(id); });

        let livingCount = data.players.filter(p => data.alivePlayers[p.id]).length;
        let votersCount = livingCount - topTargets.length;
        if (topTargets.length > 1 && votersCount === 0) {
            let tieAction = data.stdTieAction || "none";
            if(tieAction === "random") {
                let chosen = topTargets[Math.floor(Math.random() * topTargets.length)];
                executeHangStandard(data, chosen, votes);
            } else {
                executeHangStandard(data, null, votes);
            }
            return;
        }

        if(topTargets.length === 1) {
            executeHangStandard(data, topTargets[0], votes);
        } else if(topTargets.length > 1) {
            let shuffledRunoff = [...topTargets];
            shuffledRunoff.sort(() => Math.random() - 0.5);

            vState.phase = 'runoff_notice';
            vState.runoffList = topTargets;
            vState.runoffOrder = shuffledRunoff;
            lastRenderKey = "";
            await db.collection("rooms").doc(roomId).update({ standardVoteState: vState });
        }
    }

    async function resolveStandardRunoffVotes(data, vState) {
        let votes = vState.votes || {};
        let voteCounts = {};
        vState.runoffList.forEach(id => voteCounts[id] = 0);
        Object.values(votes).forEach(t => { if(voteCounts[t] !== undefined) voteCounts[t]++; });

        let maxV = 0;
        Object.values(voteCounts).forEach(c => { if(c > maxV) maxV = c; });

        let topTargets = [];
        Object.keys(voteCounts).forEach(id => { if(voteCounts[id] === maxV) topTargets.push(id); });

        if(topTargets.length === 1) {
            executeHangStandard(data, topTargets[0], votes);
        } else {
            let tieAction = data.stdTieAction || "none";
            if(tieAction === "random") {
                let chosen = topTargets[Math.floor(Math.random() * topTargets.length)];
                executeHangStandard(data, chosen, votes);
            } else {
                executeHangStandard(data, null, votes);
            }
        }
    }

    async function executeHangStandard(data, hangedId, votesMap) {
        lastRenderKey = "";
        let currentDay = data.dayCount || 1;
        let logDetails = [];
        Object.keys(votesMap || {}).forEach(voterId => {
            let voter = data.players.find(p => p.id === voterId);
            let targetId = votesMap[voterId];
            let target = data.players.find(p => p.id === targetId);
            if(voter && target) {
                logDetails.push({ voterName: voter.name, targetName: target.name });
            }
        });

        let newVoteLogs = data.voteLogs || [];
        newVoteLogs.push({
            day: currentDay,
            hangedId: hangedId,
            hangedName: hangedId ? (data.players.find(p => p.id === hangedId)?.name || "不明") : null,
            details: logDetails
        });

        let updates = {
            voteLogs: newVoteLogs,
            standardVoteState: null
        };

        if(hangedId) {
            updates.status = "last_words";
            updates.lastHangedId = hangedId;
            updates.lastWordsEndTime = Date.now() + 60000;
        } else {
            let aliveObj = { ...data.alivePlayers };
            updates.status = "vote_announce_hold";
            updates.alivePlayers = aliveObj;
            updates.lastHangedId = null;
        }

        await db.collection("rooms").doc(roomId).update(updates);
    }

    function renderLastWordsPhase(data) {
        const area = document.getElementById('action-area');
        const hangedP = data.players.find(p => p.id === data.lastHangedId);
        const isTarget = (myPlayerId === data.lastHangedId);
        const now = Date.now();
        const remSec = Math.max(0, Math.floor(((data.lastWordsEndTime || 0) - now) / 1000));
        const m = Math.floor(remSec / 60);
        const s = remSec % 60;

        let html = `
            <div style="font-size:1.5rem; color:#e94560; font-weight:bold; margin-bottom:10px;">
                📢 ${hangedP ? hangedP.name : ''} さんの遺言タイム
            </div>
            <div class="timer-display" id="last-words-timer">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div>
        `;

        if(isTarget) {
            html += `<p class="info-text">追放が決定しました。1分間の遺言をどうぞ。終わったら「遺言を終える」を押してください。</p>`;
            html += `<button style="background-color:#4ecca3; color:#1a1a2e; font-weight:bold; margin-top:15px;" onclick="finishLastWords()">遺言を終える</button>`;
        } else {
            html += `<p class="info-text">${hangedP ? hangedP.name : ''} さんが遺言を述べています...</p>`;
        }

        area.innerHTML = html;

        if (isHost && !window.lastWordsTimerIntervalSet) {
            window.lastWordsTimerIntervalSet = true;
            if(window.lwInterval) clearInterval(window.lwInterval);
            window.lwInterval = setInterval(async () => {
                let freshData = (await db.collection("rooms").doc(roomId).get()).data();
                if(!freshData || freshData.status !== "last_words") {
                    clearInterval(window.lwInterval);
                    window.lwInterval = null;
                    window.lastWordsTimerIntervalSet = false;
                    return;
                }
                let curRem = Math.max(0, Math.floor(((freshData.lastWordsEndTime || 0) - Date.now()) / 1000));
                let tElem = document.getElementById('last-words-timer');
                if(tElem) {
                    let mm = Math.floor(curRem / 60);
                    let ss = curRem % 60;
                    tElem.innerText = `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
                }

                if(curRem <= 0) {
                    clearInterval(window.lwInterval);
                    window.lwInterval = null;
                    window.lastWordsTimerIntervalSet = false;
                    completeLastWordsTransition(freshData);
                }
            }, 500);
        }
    }

    async function finishLastWords() {
        if(window.lwInterval) { clearInterval(window.lwInterval); window.lwInterval = null; }
        window.lastWordsTimerIntervalSet = false;
        let freshData = (await db.collection("rooms").doc(roomId).get()).data();
        if(freshData && freshData.status === "last_words") {
            await completeLastWordsTransition(freshData);
        }
    }

    async function completeLastWordsTransition(data) {
        if(!isHost && data.status !== "last_words") return;
        let aliveObj = { ...data.alivePlayers };
        if(data.lastHangedId) {
            aliveObj[data.lastHangedId] = false;
        }
        await db.collection("rooms").doc(roomId).update({
            status: "vote_announce_hold",
            alivePlayers: aliveObj
        });
    }

    /* 普通の人狼：夜の行動描画 */
    function renderStandardNight(data) {
        const area = document.getElementById('action-area');
        const myRole = data.finalRoles[myPlayerId];
        const alive = data.alivePlayers[myPlayerId];
        const day = data.dayCount || 1;

        if (currentNightDayTracked !== day) {
            currentNightDayTracked = day;
            myNightActionResultText = "";
            myNightDoneLocal = false;
            selectedVoteTargetId = null;
        }

        const isDone = myNightDoneLocal || (data.nightDone && data.nightDone[myPlayerId]);

        if(!alive) {
            let key = "night_dead_" + day;
            if (lastRenderKey !== key) {
                lastRenderKey = key;
                area.innerHTML = `<p style="color:#e94560;">あなたは追放/犠牲になりました。観戦中...</p>
                                  <div style="font-size:1.2rem; color:#f9ed69; margin-top:10px;">夜タイマー残り: <span id="night-timer">--:--</span></div>

        let html = `
            <div style="border-bottom:1px solid #334257; padding-bottom:10px; margin-bottom:10px;">
                <p>あなたの役職:</p>

                <p class="info-text">${roleDetails[myRole] || ''}</p>
            </div>
            <div style="font-size:1.2rem; color:#f9ed69; margin-bottom:15px;">夜タイマー残り: <span id="night-timer">--:--</span></div>
        `;

        const livingOthers = data.players.filter(p => p.id !== myPlayerId && data.alivePlayers[p.id]);

        if(!isDone) {
            if(myRole === "人狼") {
                if(day === 1) {
                    let wolves = data.players.filter(p => data.finalRoles[p.id] === "人狼" && p.id !== myPlayerId);
                    let wNames = wolves.length > 0 ? wolves.map(w => w.name).join(', ') : 'なし（一匹狼）';
                    myNightActionResultText = `仲間の人狼: ${wNames}`;
                    html += `<p>初日の夜です。襲撃はありません。</p><p style="color:#f9ed69;">仲間の人狼: <b>${wNames}</b></p>`;
                    html += renderWolfChatArea(data);
                    html += `<button onclick="completeNightAction('仲間の人狼: ' + '${wNames}')" style="margin-top:10px;">確認完了</button>`;
                } else {
                    let candidates = livingOthers.filter(p => data.finalRoles[p.id] !== "人狼");
                    if(data.wolfReVote) {
                        let reCands = data.players.filter(p => data.wolfReVoteCandidates.includes(p.id));
                        let cNames = reCands.map(c => c.name).join(' と ');
                        html += `<p style="color:#e94560;">${cNames} が襲撃対象になりました。どちらを襲撃しますか？</p>`;
                        candidates = reCands;
                    } else {
                        html += `<p class="info-text">襲撃するプレイヤーを選択してください：</p>`;
                    }

                    let currentAttackTarget = (data.nightActions && data.nightActions[myPlayerId] && data.nightActions[myPlayerId].attackTarget) || selectedVoteTargetId;
                    candidates.forEach(p => {
                        let isSel = (currentAttackTarget === p.id);
                        html += `<button class="action-btn ${isSel ? 'selected-target' : ''}" onclick="submitNightAction('attackTarget', '${p.id}', '${p.name}を襲撃')">${p.name} を襲撃 ${isSel ? '✓ 選択中' : ''}</button><br>`;
                    });
                    html += renderWolfChatArea(data);
                }
            } else if(myRole === "狂信者") {
                let wolves = data.players.filter(p => data.finalRoles[p.id] === "人狼");
                let wNames = wolves.map(w => w.name).join(', ');
                myNightActionResultText = `人狼の正体: ${wNames}`;
                html += `<p>人狼の正体: <b style="color:#d32f2f;">${wNames}</b></p>`;
                html += `<button onclick="completeNightAction('人狼の正体: ' + '${wNames}')">確認完了</button>`;
            } else if(myRole === "占い師") {
                if(day === 1) {
                    if(!myNightActionResultText) {
                        let nonWolves = data.players.filter(p => p.id !== myPlayerId && data.finalRoles[p.id] !== "人狼");
                        let randP = nonWolves[Math.floor(Math.random() * nonWolves.length)];
                        myNightActionResultText = `${randP.name} ➔ 〇（白）`;
                        addRoleHistory(`1日目: ${randP.name} ➔ 〇（白）`);
                    }
                    html += `<p style="color:#4ecca3; font-weight:bold; font-size:1.1rem;">初日占い結果: ${myNightActionResultText}</p>`;
                    html += `<button onclick="completeNightAction('初日占い: ' + '${myNightActionResultText}')">確認完了</button>`;
                } else {
                    html += `<p class="info-text">占うプレイヤーを選択してください：</p>`;
                    let currentSeerTarget = (data.nightActions && data.nightActions[myPlayerId] && data.nightActions[myPlayerId].seerTarget) || selectedVoteTargetId;
                    livingOthers.forEach(p => {
                        let isSel = (currentSeerTarget === p.id);
                        html += `<button class="action-btn ${isSel ? 'selected-target' : ''}" onclick="executeStandardSeer('${p.id}', '${p.name}', ${day})">${p.name} を占う ${isSel ? '✓ 選択中' : ''}</button><br>`;
                    });
                }
                html += renderRoleHistoryHtml();
            } else if(myRole === "霊媒師") {
                if(day === 1) {
                    myNightActionResultText = "初日のため対象なし";
                    html += `<p class="info-text">初日の夜は霊媒対象がいません。</p>`;
                    html += `<button onclick="completeNightAction('霊媒結果: なし')">確認完了</button>`;
                } else if(data.lastHangedId) {
                    let hangedP = data.players.find(p => p.id === data.lastHangedId);
                    let isW = data.finalRoles[data.lastHangedId] === "人狼";
                    let resStr = isW ? "●（人狼）" : "〇（人狼ではない）";
                    myNightActionResultText = `${hangedP.name} ➔ ${resStr}`;
                    addRoleHistory(`${day}日目: ${hangedP.name} ➔ ${resStr}`);
                    html += `<p>前日追放された ${hangedP.name} は <b style="color:#f9ed69;">${resStr}</b> でした。</p>`;
                    html += `<button onclick="completeNightAction('霊媒結果: ' + '${hangedP.name} ➔ ' + '${resStr}')">確認完了</button>`;
                } else {
                    myNightActionResultText = "前日追放者なし";
                    html += `<p class="info-text">前日の追放者はいませんでした。</p>`;
                    html += `<button onclick="completeNightAction('霊媒結果: なし')">確認完了</button>`;
                }
                html += renderRoleHistoryHtml();
            } else if(myRole === "狩人") {
                if(day === 1) {
                    myNightActionResultText = "初日のため護衛なし";
                    html += `<p>初日の夜は護衛を行いません。</p>`;
                    html += `<button onclick="completeNightAction('初日護衛なし')">確認完了</button>`;
                } else {
                    let lastT = (data.lastHunterTarget && data.lastHunterTarget[myPlayerId]) || null;
                    let currentHunterTarget = (data.nightActions && data.nightActions[myPlayerId] && data.nightActions[myPlayerId].hunterTarget) || selectedVoteTargetId;
                    html += `<p class="info-text">護衛するプレイヤーを選択してください（自分不可・連護不可）：</p>`;
                    livingOthers.filter(p => p.id !== lastT).forEach(p => {
                        let isSel = (currentHunterTarget === p.id);
                        html += `<button class="action-btn ${isSel ? 'selected-target' : ''}" onclick="submitNightAction('hunterTarget', '${p.id}', '${p.name}を護衛')">${p.name} を護衛 ${isSel ? '✓ 選択中' : ''}</button><br>`;
                    });
                }
            } else {
                myNightActionResultText = "能力行使なし";
                html += `<p class="info-text">夜の能力はありません。</p>`;
                html += `<button onclick="completeNightAction('能力行使なし')">確認完了</button>`;
            }
        } else {
            html += `
                <div style="background:#0f3460; border:1px solid #4ecca3; padding:15px; border-radius:8px; margin-top:10px;">
                    <p style="color:#4ecca3; font-weight:bold; margin-top:0;">✅ 夜の確認・行動が完了しています</p>
                    <p style="margin:4px 0;"><b>あなたの行動結果:</b> ${myNightActionResultText || '確認済み'}</p>
                </div>
            `;
            if(myRole === "占い師" || myRole === "霊媒師") {
                html += renderRoleHistoryHtml();
            }
            html += `<p class="info-text" style="margin-top:15px;">夜タイマー終了までお待ちください...</p>`;
        }

        html += renderVoteLogsHtml(data);
        area.innerHTML = html;
    }

    function addRoleHistory(entryStr) {
        if (!myRoleHistory.includes(entryStr)) {
            myRoleHistory.push(entryStr);
        }
    }

    function renderRoleHistoryHtml() {
        if (myRoleHistory.length === 0) return "";
        let listItems = myRoleHistory.map(h => `<li style="margin:3px 0;">${h}</li>`).join('');
        return `
            <div class="history-box">
                <p style="margin:0 0 6px 0; font-weight:bold; color:#4ecca3;">📜 これまでの占い・霊媒履歴</p>
                <ul style="margin:0; padding-left:20px;">${listItems}</ul>
            </div>
        `;
    }

    function renderVoteLogsHtml(data) {
        let logs = data.voteLogs || [];
        if (logs.length === 0) return "";

        let logsHtml = logs.map(l => {
            let hangedMsg = l.hangedName ? `<span style="color:#e94560; font-weight:bold;">${l.hangedName} さんが追放されました</span>` : `<span style="color:#4ecca3;">誰も追放されませんでした</span>`;
            let detailsStr = l.details.map(d => `${d.voterName} ➔ ${d.targetName}`).join(', ');
            return `
                <div style="border-bottom:1px dashed #334257; padding-bottom:6px; margin-bottom:6px;">
                    <b>【${l.day}日目 投票結果】</b>: ${hangedMsg}<br>
                    <span style="font-size:0.75rem; color:#aaa;">投票内訳: ${detailsStr}</span>
                </div>
            `;
        }).join('');

        return `
            <div class="history-box" style="border-color:#f9ed69;">
                <p style="margin:0 0 6px 0; font-weight:bold; color:#f9ed69;">🗳️ これまでの投票履歴</p>
                ${logsHtml}
            </div>
        `;
    }

    function renderWolfChatArea(data) {
        let logs = data.wolfChatLogs || [];
        let logHtml = logs.map(l => `<div><b>${l.sender}:</b> ${l.msg}</div>`).join('');
        return `
            <div class="wolf-chat-box">
                <p style="margin:2px 0; font-size:0.8rem; color:#d32f2f; font-weight:bold;">人狼専用リアルタイムチャット</p>
                <div class="wolf-chat-logs" id="wolf-chat-logs">${logHtml}</div>
                <input type="text" id="wolf-chat-input" placeholder="メッセージを入力" style="width:70%;">
                <button onclick="sendWolfChat()" style="padding:6px 10px; font-size:0.8rem;">送信</button>
            </div>
        `;
    }

    async function sendWolfChat() {
        let input = document.getElementById('wolf-chat-input');
        if(!input || !input.value.trim()) return;
        let msg = input.value.trim();
        input.value = "";

        let logs = localRoomData.wolfChatLogs || [];
        logs.push({ sender: myName, msg: msg });
        await db.collection("rooms").doc(roomId).update({ wolfChatLogs: logs });
    }

    async function executeStandardSeer(targetId, targetName, day) {
        selectedVoteTargetId = targetId;
        let isW = localRoomData.finalRoles[targetId] === "人狼";
        let res = isW ? "●（人狼）" : "〇（人狼ではない）";
        myNightActionResultText = `${targetName} ➔ ${res}`;
        addRoleHistory(`${day}日目: ${targetName} ➔ ${res}`);

        let updateObj = {};
        updateObj[`nightActions.${myPlayerId}.seerTarget`] = targetId;
        await db.collection("rooms").doc(roomId).update(updateObj);

        await completeNightAction(`占い結果: ${targetName} ➔ ${res}`);
    }

    async function submitNightAction(actionType, targetId, resultText) {
        selectedVoteTargetId = targetId;
        myNightActionResultText = resultText;

        let updateObj = {};
        updateObj[`nightActions.${myPlayerId}.${actionType}`] = targetId;
        await db.collection("rooms").doc(roomId).update(updateObj);

        await completeNightAction(resultText);
    }

            roleExplanation = '自分の役職は非表示設定です。自分が多数派なのか少数派（ウルフ）なのか会話から探りましょう！';

        let html = `
            <div style="border-bottom:1px solid #334257; padding-bottom:10px; margin-bottom:10px;">
                <p>あなたに配られたお題:</p>
                <p class="role-name" style="color:#f9ed69; font-size:2rem;">${wwWord}</p>
                <p class="info-text">${roleExplanation}</p>
            </div>
            <button onclick="completeNightAction('お題: ' + '${wwWord}')">確認完了</button>
        `;

    }

        const area = document.getElementById('action-area');

        const players = data.players.filter(p => p.id !== myPlayerId);
        const displayMyRole = roleIcons[myRole] || myRole;

        let html = `
            <div style="border-bottom:1px solid #334257; padding-bottom:10px; margin-bottom:10px;">
                <p>あなたの初期役職:</p>
                <p class="role-name">${displayMyRole}</p>
                <p class="info-text">${roleDetails[myRole] || ''}</p>
            </div>
        `;

        if(myRole === "占い師") {
            html += `<p class="info-text">占い師の能力対象を選んでください：</p>`;
            players.forEach(p => {
                let isSel = (selectedVoteTargetId === p.id);
                html += `<button class="action-btn ${isSel ? 'selected-target' : ''}" onclick="executeOnlineSeer('${p.id}', '${p.name}')">${p.name} を占う ${isSel ? '✓ 選択中' : ''}</button><br>`;
