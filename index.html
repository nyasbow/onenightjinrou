            html += `<button class="action-btn" style="border-color:#f9ed69;" onclick="executeOnlineSeerCentral()">中央の2枚を占う</button>`;
        } else if(myRole === "怪盗") {
            html += `<p class="info-text">怪盗の能力対象を選んでください：</p>`;
            players.forEach(p => {
                let isSel = (selectedVoteTargetId === p.id);
                html += `<button class="action-btn ${isSel ? 'selected-target' : ''}" onclick="executeOnlineThief('${p.id}', '${p.name}')">${p.name} と交換 ${isSel ? '✓ 選択中' : ''}</button><br>`;
            });
            html += `<button class="action-btn" style="border-color:#aaa;" onclick="completeNightAction('交換しませんでした')">交換しない</button>`;
        } else if(myRole === "人狼") {
            let wolves = data.players.filter(p => data.initialRoles[p.id] === "人狼" && p.id !== myPlayerId);
            if(wolves.length > 0) {
                let wNames = wolves.map(w => w.name).join(', ');
                myNightActionResultText = `仲間の人狼: ${wNames}`;
                html += `
                    <div style="margin: 10px 0;">
                        <img src="jinrou.png" style="height: 96px; object-fit: contain; display: block; margin: 0 auto 6px auto;">
                        <p style="margin:0; font-size:0.95rem; color:#f9ed69;">仲間の人狼: <b>${wNames}</b></p>
                    </div>
                `;
            } else {
                myNightActionResultText = `仲間の人狼はいません`;
                html += `
                    <div style="margin: 10px 0;">
                        <img src="jinrou.png" style="height: 96px; object-fit: contain; display: block; margin: 0 auto 6px auto;">
                        <p style="margin:0; font-size:0.95rem; color:#ccc;">仲間の人狼はいません（一匹狼）</p>
                    </div>
                `;
            }
            html += `<button onclick="completeNightAction('${myNightActionResultText}')" style="margin-top:10px;">確認・行動完了</button>`;
        } else {
            myNightActionResultText = "能力行使なし";
            html += `<p class="info-text">この役職に夜の特殊能力はありません。</p>`;
            html += `<button onclick="completeNightAction('能力行使なし')" style="margin-top:10px;">確認完了</button>`;
        }

        area.innerHTML = html;
    }

    async function executeOnlineSeer(targetId, targetName) {
        if(myNightDoneLocal) return;
        selectedVoteTargetId = targetId;
        const role = localRoomData.initialRoles[targetId];
        const displayRole = roleIcons[role] || role;
        myNightActionResultText = `${targetName} ➔ ${displayRole}`;
        renderNightActionsHub(localRoomData);
        setTimeout(() => completeNightAction(`占い結果: ${targetName} ➔ ${displayRole}`), 300);
    }

    async function executeOnlineSeerCentral() {
        if(myNightDoneLocal) return;
        const c = localRoomData.centralCards;
        const displayC0 = roleIcons[c[0]] || c[0];
        const displayC1 = roleIcons[c[1]] || c[1];
        myNightActionResultText = `中央2枚 ➔ ${displayC0} と ${displayC1}`;
        await completeNightAction(`中央占い: ${displayC0} / ${displayC1}`);
    }

    async function executeOnlineThief(targetId, targetName) {
        if(myNightDoneLocal) return;
        selectedVoteTargetId = targetId;
        let finalRoles = localRoomData.finalRoles;
        const targetRole = finalRoles[targetId];
        const displayTargetRole = roleIcons[targetRole] || targetRole;
        
        finalRoles[myPlayerId] = targetRole;
        finalRoles[targetId] = "怪盗";

        myNightActionResultText = `${targetName} と交換 ➔ ${displayTargetRole}`;

        await db.collection("rooms").doc(roomId).update({ finalRoles: finalRoles });
        renderNightActionsHub(localRoomData);
        setTimeout(() => completeNightAction(`怪盗結果: ${targetName}と交換`), 300);
    }

    async function completeNightAction(customText) {
        if(customText) myNightActionResultText = customText;
        myNightDoneLocal = true;

        let updateObj = {};
        updateObj[`nightDone.${myPlayerId}`] = true;

        await db.collection("rooms").doc(roomId).update(updateObj);
    }

    function processStandardNightActions(data) {
        const nActions = data.nightActions || {};
        const day = data.dayCount || 1;
        if(day === 1) return { reVote: false, victimId: null, lastHunterTarget: {} };

        let attackVotes = {};
        Object.keys(nActions).forEach(pId => {
            if(data.finalRoles[pId] === "人狼" && nActions[pId].attackTarget) {
                let t = nActions[pId].attackTarget;
                attackVotes[t] = (attackVotes[t] || 0) + 1;
            }
        });

        let maxV = 0;
        Object.values(attackVotes).forEach(v => { if(v > maxV) maxV = v; });

        let topTargets = [];
        Object.keys(attackVotes).forEach(t => { if(attackVotes[t] === maxV) topTargets.push(t); });

        if(topTargets.length > 1 && !data.wolfReVote) {
            return { reVote: true, reVoteCandidates: topTargets };
        }

        let attackTargetId = null;
        if(topTargets.length === 1) {
            attackTargetId = topTargets[0];
        } else if(topTargets.length > 1) {
            attackTargetId = topTargets[Math.floor(Math.random() * topTargets.length)];
        }

        let hunterTargets = [];
        let newHunterLast = {};
        Object.keys(nActions).forEach(pId => {
            if(data.finalRoles[pId] === "狩人" && nActions[pId].hunterTarget) {
                hunterTargets.push(nActions[pId].hunterTarget);
                newHunterLast[pId] = nActions[pId].hunterTarget;
            }
        });

        let victimId = attackTargetId;
        if(attackTargetId && hunterTargets.includes(attackTargetId)) {
            victimId = null;
        }

        return { reVote: false, victimId: victimId, lastHunterTarget: newHunterLast };
    }

                if(finalRoles[id] === "人狼") aliveWolves++;
                else aliveHumans++;
            }
        });

        if(aliveWolves === 0) return "human_win";
        if(aliveWolves >= aliveHumans) return "wolf_win";
        return null;
    }

            playerStats[p.id].totalPlayed++;

    }

    function calculateWordWolfResults(data, winnerCamp) {
        let playerStats = JSON.parse(JSON.stringify(data.playerStats || {}));

        data.players.forEach(p => {
            const isWolf = data.initialRoles[p.id] === "人狼";
            let isWon = (winnerCamp === "wolf_win") ? isWolf : !isWolf;

            if(!playerStats[p.id]) {
                playerStats[p.id] = { totalPlayed: 0, totalWon: 0 };
            }
            playerStats[p.id].totalPlayed++;
            if(isWon) playerStats[p.id].totalWon++;
        });

        return playerStats;
    }

    function calculateGameResults(data, votes) {
        const players = data.players;
        const finalRoles = data.finalRoles;

        let voteCounts = {};
        players.forEach(p => voteCounts[p.id] = 0);
        Object.values(votes).forEach(t => { if(t !== 'none' && voteCounts[t] !== undefined) voteCounts[t]++; });

        let maxVotes = 0;
        Object.values(voteCounts).forEach(c => { if(c > maxVotes) maxVotes = c; });

        let hangedIds = [];
        if (maxVotes >= 2) {
            Object.keys(voteCounts).forEach(id => {
                if (voteCounts[id] === maxVotes) hangedIds.push(id);
            });
        }

        let aliveWerewolfCount = players.filter(p => finalRoles[p.id] === "人狼").length;
        let isPeaceVillageScenario = (aliveWerewolfCount === 0);
        let isVillagerWin = false;

        if (isPeaceVillageScenario) {
            isVillagerWin = (hangedIds.length === 0);
        } else {
            let hangedWerewolf = hangedIds.some(id => finalRoles[id] === "人狼");
            isVillagerWin = hangedWerewolf;
        }

        let playerStats = JSON.parse(JSON.stringify(data.playerStats || {}));

        players.forEach(p => {
            const finalR = finalRoles[p.id];
            let isWon = false;

            if (isPeaceVillageScenario) {
                isWon = (hangedIds.length === 0);
            } else {
                let isWerewolfCamp = (finalR === "人狼" || finalR === "狂人");
                isWon = isWerewolfCamp ? !isVillagerWin : isVillagerWin;
            }

            if(!playerStats[p.id]) {
                playerStats[p.id] = { totalPlayed: 0, totalWon: 0 };
            }
            playerStats[p.id].totalPlayed++;
            if(isWon) playerStats[p.id].totalWon++;
        });

        return playerStats;
    }

                summaryText = "人狼が投票で選ばれなかったため、人狼の勝利です！";
            } else {
                wolfWon = (correctCount >= incorrectCount);
                summaryText = wolfWon ? "人狼が最多票に選ばれましたが、お題を見事当てたため人狼の勝利です！" : "人狼が最多票に選ばれ、お題を外したため市民側の勝利です！";
            }

            let iWon = (wolfWon && wolfIds.includes(myPlayerId)) || (!wolfWon && !wolfIds.includes(myPlayerId));
            let resultTitleHtml = iWon ? `<div class="win-title">あなたの勝利！</div>` : `<div class="lose-title">あなたの敗北...</div>`;

            let tableRows = players.map(p => {
                let isW = wolfIds.includes(p.id);
                let pWord = data.wordWolfData.assignments[p.id];
                let pWon = (wolfWon && isW) || (!wolfWon && !isW);
                let winLoseHtml = pWon ? '<span style="color:#4ecca3; font-weight:bold;">勝利</span>' : '<span style="color:#e94560; font-weight:bold;">敗北</span>';

                return `
                    <tr>
                        <td><b>${p.name}</b> ${isW ? '<span style="color:#d32f2f; font-weight:bold;">[人狼]</span>' : '[市民]'}</td>
                        <td>${pWord}</td>
                        <td><b>${winLoseHtml}</b></td>
                    </tr>
                `;
            }).join('');

            area.innerHTML = `
                ${resultTitleHtml}
                <p class="info-text">${summaryText}</p>

                <p style="margin-top:10px;"><b>正解のお題:</b></p>
                <p style="font-size:0.95rem; color:#f9ed69;">市民側: ${data.wordWolfData.civilianWord} ／ 人狼側: ${data.wordWolfData.wolfWord}</p>

                <table class="result-table">
                    <thead>
                        <tr>
                            <th>名前 (役職)</th>
                            <th>配られたお題</th>
                            <th>勝敗</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>

                ${isHost ? `<button onclick="resetGameToWaiting()" style="margin-top:15px;">もう一度遊ぶ（待機部屋へ）</button>` : '<p class="info-text">ホストが次のゲームを開始するのを待っています...</p>'}
            `;

        } else {
            const votes = data.votes;
            const finalRoles = data.finalRoles;
            const initialRoles = data.initialRoles;

            let voteCounts = {};
            players.forEach(p => voteCounts[p.id] = 0);
            Object.values(votes).forEach(t => { if(t !== 'none' && voteCounts[t] !== undefined) voteCounts[t]++; });

            let maxVotes = 0;
            Object.values(voteCounts).forEach(c => { if(c > maxVotes) maxVotes = c; });

            let hangedIds = [];
            if (maxVotes >= 2) {
                Object.keys(voteCounts).forEach(id => {
                    if (voteCounts[id] === maxVotes) hangedIds.push(id);
                });
            }

            let aliveWerewolfCount = players.filter(p => finalRoles[p.id] === "人狼").length;
            let isPeaceVillageScenario = (aliveWerewolfCount === 0);
            let isVillagerWin = false;

            if (isPeaceVillageScenario) {
                isVillagerWin = (hangedIds.length === 0);
            } else {
                let hangedWerewolf = hangedIds.some(id => finalRoles[id] === "人狼");
                isVillagerWin = hangedWerewolf;
            }

            function checkPlayerWon(pId) {
                let pFinalRole = finalRoles[pId];
                let isCampWerewolf = (pFinalRole === "人狼" || pFinalRole === "狂人");
                return isPeaceVillageScenario ? (hangedIds.length === 0) : (isCampWerewolf ? !isVillagerWin : isVillagerWin);
            }

            let iWon = checkPlayerWon(myPlayerId);
            let resultTitleHtml = iWon ? `<div class="win-title">あなたの勝利！</div>` : `<div class="lose-title">あなたの敗北...</div>`;

            let summaryText = "";
            if (isPeaceVillageScenario) {
                summaryText = hangedIds.length === 0 ? "平和村が達成されました！（人狼不在・処刑なし）" : "平和村でしたが、処刑が行われてしまいました。";
            } else {
                summaryText = isVillagerWin ? "村人陣営の勝利です！（人狼の処刑に成功）" : "人狼陣営の勝利です！（人狼が生き残りました）";
            }

            let tableRows = players.map(p => {
                let initR = roleIcons[initialRoles[p.id]] || initialRoles[p.id];
                let finR = roleIcons[finalRoles[p.id]] || finalRoles[p.id];
                let vTargetId = votes[p.id];
                let vTargetName = vTargetId === 'none' ? '平和村' : (players.find(x => x.id === vTargetId)?.name || '未投票');
                let isHanged = hangedIds.includes(p.id) ? ' <span style="color:#e94560; font-weight:bold;">[処刑]</span>' : '';
                
                let pWon = checkPlayerWon(p.id);
                let winLoseHtml = pWon ? '<span style="color:#4ecca3; font-weight:bold;">勝利</span>' : '<span style="color:#e94560; font-weight:bold;">敗北</span>';

                return `
                    <tr>
                        <td><b>${p.name}</b>${isHanged}</td>
                        <td>${initR}</td>
                        <td><b>${finR}</b></td>
                        <td>${vTargetName}</td>
                        <td><b>${winLoseHtml}</b></td>
                    </tr>
                `;
            }).join('');

            let centralStr = (data.centralCards || []).map(r => roleIcons[r] || r).join(' / ');

            area.innerHTML = `
                ${resultTitleHtml}
                <p class="info-text">${summaryText}</p>

                <table class="result-table">
                    <thead>
                        <tr>
                            <th>名前</th>
                            <th>初期役職</th>
                            <th>最終役職</th>
                            <th>投票先</th>
                            <th>勝敗</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>

                <p style="margin-top:15px; font-size:0.9rem;"><b>中央のあまりカード:</b> ${centralStr}</p>

                ${isHost ? `<button onclick="resetGameToWaiting()" style="margin-top:15px;">もう一度遊ぶ（待機部屋へ）</button>` : '<p class="info-text">ホストが次のゲームを開始するのを待っています...</p>'}
            `;
        }
    }

    async function resetGameToWaiting() {
        personalMemos = {};
        myNightDoneLocal = false;
        myRoleHistory = [];
        selectedVoteTargetId = null;
        currentNightDayTracked = 0;
        lastRenderKey = "";
        if(window.wwTimerInterval) { clearInterval(window.wwTimerInterval); window.wwTimerInterval = null; }
        if(votePhaseTimerInterval) { clearInterval(votePhaseTimerInterval); votePhaseTimerInterval = null; }
        if(nightTimerInterval) { clearInterval(nightTimerInterval); nightTimerInterval = null; window.nightTimerRunning = false; }
        if(window.lwInterval) { clearInterval(window.lwInterval); window.lwInterval = null; }
        window.handraiseTimerCheckStarted = false;
        window.noticeTimerStarted = false;
        window.speechTimerStarted = false;
        window.runoffNoticeStarted = false;
        window.runoffSpeechStarted = false;
        window.voteAnnounceTimerSet = false;
        window.morningTimerSet = false;
        window.lastWordsTimerIntervalSet = false;
        
        await db.collection("rooms").doc(roomId).update({
            status: "waiting",
            allDeck: [],
            initialRoles: {},
            finalRoles: {},
            centralCards: [],
            wordWolfData: {},
            nightDone: {},
            nightActions: {},
            wolfReVote: false,
            wolfReVoteCandidates: [],
            wolfChatLogs: [],
            alivePlayers: {},
            lastHangedId: null,
            lastNightVictimId: null,
            lastHunterTarget: {},
            dayCount: 1,
            votes: {},
            voteLogs: [],
            standardVoteState: null,
            guessVotes: {},
            timerEndTime: null,
            nightTimerEndTime: null,
            lastWordsEndTime: null
        });
    }
</script>
